# One-shot worker scoped to this authorized integration branch. It deletes itself
# before publishing the candidate and NEVER pushes to main or merges a PR.
name: Integração autorizada — execução única
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: resolve-open-prs-20260906
  cancel-in-progress: false
jobs:
  integrate:
    if: github.head_ref == 'codex/resolve-open-prs-20260906' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Integra somente os três SHAs revisados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tools/ci/integrate_once.py
      - name: Cacheia a engine
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Baixa a engine se necessário
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          curl -fsSL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d ~/godot-bin
          chmod +x ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64
      - name: Testa o candidato antes de publicá-lo
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
          bash -n tools/loop/unclaimed_surface.sh
          python3 tools/ci/headless_gate.py \
            --godot "$HOME/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" \
            --logs "${RUNNER_TEMP}/qix-integration" \
            --isolate-missing-editor-extension
      - name: Publica somente a branch de integração, sem force-push
        run: git push origin HEAD:refs/heads/codex/resolve-open-prs-20260906
      - name: Evidência do candidato, inclusive em caso de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/qix-integration
          if-no-files-found: warn
          retention-days: 14

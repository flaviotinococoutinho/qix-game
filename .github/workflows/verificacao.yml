# Headless verification is not exported-build, GPU, audio-device, or Android QA.
name: Verificação
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: 4.7.2-stable
jobs:
  suite-headless:
    name: Suíte headless (Godot 4.7.2-stable)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cacheia o binário do Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Baixa o Godot headless
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          curl -fsSL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d ~/godot-bin
          chmod +x ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64
      - name: Regressões do próprio portão de CI
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Importação, suíte, rota M2 e geometria real do HUD
        run: |
          python3 tools/ci/headless_gate.py \
            --godot "$HOME/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" \
            --logs "${RUNNER_TEMP}/qix-headless" \
            --isolate-missing-editor-extension
      # Só `unclaimed_surface.sh` era checado, e foi por isso que os dois relatórios de fila
      # puderam divergir sem que nada reclamasse. O portão passa a cobrir a pasta inteira.
      - name: Sintaxe do ferramental do loop
        run: |
          set -euo pipefail
          for script in tools/loop/*.sh; do
            echo "bash -n ${script}"
            bash -n "${script}"
          done
      - name: Evidências completas por commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qix-headless
          if-no-files-found: warn
          retention-days: 14

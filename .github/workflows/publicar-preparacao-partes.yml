name: Valida e publica as 31 PRs preparadas
on:
  push:
    branches: [maintenance/prepare-prs-57-86-20260908]
    paths: [.github/maintenance/transport.json]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: qix-publicacao-revisada-20260908
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.7.2-stable-linux-x86_64
      - name: Garante engine fixada
        run: |
          set -euo pipefail
          if [ ! -f "$HOME/godot-bin/Godot_v4.7.2-stable_linux.x86_64" ]; then
            mkdir -p "$HOME/godot-bin"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
            unzip -q -o "$RUNNER_TEMP/godot.zip" -d "$HOME/godot-bin"
          fi
          chmod +x "$HOME/godot-bin/Godot_v4.7.2-stable_linux.x86_64"
      - name: Reconstitui transporte e verifica checksum
        shell: python
        run: |
          import base64, hashlib, json, pathlib, zlib
          root = pathlib.Path('.github/maintenance')
          payload = json.loads((root / 'transport.json').read_text())
          parts = payload.pop('bundle_parts')
          if parts != [str(root / f'bundle-{i}.b64') for i in range(4)]:
              raise RuntimeError('Lista de partes fora do contrato.')
          encoded = ''.join(pathlib.Path(p).read_text().strip() for p in parts)
          raw = zlib.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(raw).hexdigest() != payload['bundle_sha256']:
              raise RuntimeError('Checksum divergente: nenhuma branch foi alterada.')
          payload['bundle_base64'] = base64.b64encode(raw).decode()
          (root / 'prepared-payload.json').write_text(json.dumps(payload))
      - name: Valida integridade, testes e publica sem sobrescrita
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .github/maintenance/publish_prepared.py
      - name: Retém evidências da publicação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qix-preparacao-evidencias-${{ github.run_id }}
          path: ${{ runner.temp }}/qix-publication/evidence
          if-no-files-found: warn
          retention-days: 14

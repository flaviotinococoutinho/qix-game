name: Concilia a última correção documental da PR 65
on:
  push:
    branches: [maintenance/prepare-prs-57-86-20260908]
    paths: [.github/workflows/incorporar-ajuste-documental.yml]
permissions:
  contents: write
  pull-requests: read
  actions: read
jobs:
  conciliar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.7.2-stable-linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: qix-preparacao-evidencias-34174939113
          run-id: 34174939113
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-evidence
      - name: Preserva histórico, concilia documentação e valida antes de publicar
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: python
        run: |
          import json, os, pathlib, re, subprocess, urllib.request
          root = pathlib.Path.cwd()
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          logs = temp / 'qix-documental-evidence'
          logs.mkdir()
          report = json.loads((temp / 'original-evidence/publication.json').read_text())
          p65 = next(p for p in report['prs'] if p['pr'] == 65)
          p78 = next(p for p in report['prs'] if p['pr'] == 78)
          head65 = 'acc3635ba18318525accf0e682a72c452fd1fa11'
          old78 = '3c9724f556856861b936ac43662b019945856eb6'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(path):
              req = urllib.request.Request('https://api.github.com/repos/flaviotinococoutinho/qix-game' + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          if api('/branches/main')['commit']['sha'] != report['base']:
              raise RuntimeError('main avançou.')
          for p in report['prs']:
              expected = head65 if p['pr'] == 65 else p['checkpoint']
              info = api('/pulls/' + str(p['pr']))
              if info['head']['sha'] != expected or info['state'] != 'open':
                  raise RuntimeError('Nova alteração concorrente na PR #' + str(p['pr']))
          if git('diff', '--name-only', p65['checkpoint'], head65).splitlines() != ['docs/TEST_MATRIX.md']:
              raise RuntimeError('A correção #65 não é apenas a linha documental revisada.')
          if git('rev-parse', head65 + '^{tree}') != 'c6e3c28ba556e93c06c00b70abea1f4f3a0d3e7d':
              raise RuntimeError('Árvore #65 mudou.')
          git('config', 'user.name', 'Preparação assistida do mantenedor')
          git('config', 'user.email', 'review@users.noreply.github.com')
          git('checkout', '--detach', old78)
          original = subprocess.check_output(['git', 'show', old78 + ':docs/TEST_MATRIX.md'], text=True)
          result = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', head65])
          conflicts = git('diff', '--name-only', '--diff-filter=U').splitlines()
          if result.returncode not in (0, 1) or any(p != 'docs/TEST_MATRIX.md' for p in conflicts):
              raise RuntimeError('Conflito fora do escopo documental revisado.')
          line = '| log final da suíte | 309 testes, 14838 asserções, 0 falhas — gate Linux headless da árvore preparada; evidência por SHA e árvore em manifest.json. O histórico de shipping permanece na seção própria. |'
          updated, count = re.subn(r'^\| log final da suíte \|.*$', line, original, flags=re.MULTILINE)
          if count != 1:
              raise RuntimeError('Linha de proveniência não é única.')
          (root / 'docs/TEST_MATRIX.md').write_text(updated)
          git('add', 'docs/TEST_MATRIX.md')
          git('commit', '-m', 'Concilia a proveniência da suíte com a correção concorrente da PR #65')
          prepared = git('rev-parse', 'HEAD')
          env = dict(os.environ, XDG_DATA_HOME=str(temp / 'doc-user-data'), XDG_CONFIG_HOME=str(temp / 'doc-user-config'), XDG_CACHE_HOME=str(temp / 'doc-user-cache'), GODOT_SILENCE_ROOT_WARNING='1')
          engine = str(pathlib.Path.home() / 'godot-bin/Godot_v4.7.2-stable_linux.x86_64')
          with (logs / 'gate.log').open('w') as stream:
              subprocess.run(['python3', 'tools/ci/headless_gate.py', '--godot', engine, '--logs', str(logs / 'headless'), '--isolate-missing-editor-extension'], env=env, stdout=stream, stderr=subprocess.STDOUT, check=True, timeout=300)
          match = re.search(r'(\d+) testes, (\d+) asserções, (\d+) falhas', (logs / 'headless/suite.log').read_text())
          if not match or list(map(int, match.groups())) != [309, 14838, 0]:
              raise RuntimeError('Suíte integrada não confirmou os números.')
          if git('status', '--porcelain'):
              raise RuntimeError('QA alterou a árvore rastreada.')
          git('commit', '--allow-empty', '-m', 'Confirma a árvore integrada após a conciliação documental')
          checkpoint = git('rev-parse', 'HEAD')
          p65.update(prepared_head=head65, checkpoint=head65, tree=git('rev-parse', head65 + '^{tree}'), verified_head=head65)
          p78.update(prepared_head=prepared, checkpoint=checkpoint, tree=git('rev-parse', checkpoint + '^{tree}'))
          for p in report['prs']:
              expected = old78 if p['pr'] == 78 else p['checkpoint']
              if api('/pulls/' + str(p['pr']))['head']['sha'] != expected:
                  raise RuntimeError('Head avançou durante a conciliação; nada será sobrescrito.')
          subprocess.run(['git', 'push', '--atomic', 'origin', prepared + ':refs/heads/' + p78['branch'], checkpoint + ':refs/heads/maintenance/prepared-validation-20260908'], check=True)
          report['documentation_reconciliation'] = {'pr65': head65, 'pr78': checkpoint}
          (logs / 'publication.json').write_text(json.dumps(report, indent=2, ensure_ascii=False))
          print(json.dumps(report, ensure_ascii=False))
      - name: Retém evidência documental e manifesto atualizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qix-documental-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/qix-documental-evidence
          retention-days: 14
